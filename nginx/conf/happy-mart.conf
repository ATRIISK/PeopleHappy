# 众乐电子商城 - Nginx 配置
# 适用环境：生产部署 / Docker 编排
# 开发环境前端仍用 Vite Dev Server（端口 3000）+ 代理

server {
    listen 80;
    server_name localhost;

    # 字符集
    charset utf-8;

    # 前端静态文件（Vue 构建产物）
    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # 前端 SPA 路由：所有非文件请求指向 index.html
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    # API 反向代理 → Spring Boot 后端
    location /api/ {
        proxy_pass http://backend:8074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置（支付回调可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 本地上传的商品图片 → 反向代理到 Spring Boot（文件在后端 upload 目录，不在 dist）
    # 必须加 ^~（v1.10）：否则下面的 location ~* \.(jpg|jpeg|png|gif|...)$ 正则会匹配
    # /upload/*.jpg，并从 dist 目录找文件 → 404。^~ 让前缀匹配直接胜出、跳过正则。
    # proxy_pass 不加末尾斜杠 → /upload/ 前缀原样转发给后端，后端 WebMvcConfig 静态映射到 upload 目录
    location ^~ /upload/ {
        proxy_pass http://backend:8074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;                              # UUID 文件名不可变，可长缓存
        add_header Cache-Control "public";
    }

    # 静态资源缓存（图片、字体等）
    location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}