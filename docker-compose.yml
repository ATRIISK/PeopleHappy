version: "3.8"

services:
  # ===== 数据库 =====
  mysql:
    image: mysql:8.0
    container_name: happy-mart-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: happy_mart
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./happy_mart/src/main/resources/db/init-data.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  # ===== 缓存 =====
  redis:
    image: redis:7-alpine
    container_name: happy-mart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ===== 消息队列 =====
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: happy-mart-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # 管理界面
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ===== Spring Boot 后端 =====
  backend:
    build:
      context: ./happy_mart
      dockerfile: Dockerfile
    container_name: happy-mart-backend
    restart: unless-stopped
    ports:
      - "8074:8074"
    # 本地上传图片目录持久化（v1.10 商品图片本地上传）
    # 宿主 E:\PeopleHappy\happy_mart\upload ↔ 容器 /app/upload（WORKDIR=/app + app.upload-dir: ./upload）
    # 不挂 volume 的话，容器重建后上传的图片会丢失
    volumes:
      - ./happy_mart/upload:/app/upload
      # 商品知识库索引持久化（v1.11 AI 购物助手）
      # 宿主 E:\PeopleHappy\happy_mart\data ↔ 容器 /app/data（kb.index-file-path: ./data/product_kb_index.json）
      # 不挂 volume 的话，容器重建后要重新调 embedding 接口全量建库
      - ./happy_mart/data:/app/data
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/happy_mart?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      # AI 购物助手（2026-11-01 修订）：GLM API Key 改为环境变量注入，密钥不再进代码库。
      # 下面这种「只写变量名、不写值」的形式表示从宿主机环境继承：
      #   宿主设了 GLM_API_KEY → 容器内就有；宿主没设 → 容器内也没有，
      #   application.yml 的 ${GLM_API_KEY:dummy} 会用 dummy 兜底，服务照常启动（AI 调用认证失败）。
      # 刻意不用 ${GLM_API_KEY:-}：空串会覆盖掉 yml 里的默认值，反而让 Spring AI 的非空校验失败。
      - GLM_API_KEY
    depends_on:
      - mysql
      - redis
      - rabbitmq

  # ===== Nginx 前端 + 反向代理 =====
  nginx:
    image: nginx:1.27-alpine
    container_name: happy-mart-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/conf/happy-mart.conf:/etc/nginx/conf.d/default.conf
      - ./happy-mart-web/dist:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  rabbitmq-data: