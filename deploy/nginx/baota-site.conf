# =============================================
# 众乐电子商城 - 宝塔 Nginx 站点配置
#
# 用法：宝塔面板 → 网站 → 你的站点 → 设置 → 配置文件
# 把整个 server { } 块替换成下面这份（保留宝塔自动生成的 SSL 段落，如果你开了 HTTPS）
#
# 路径参考：/www/server/panel/vhost/nginx/你的域名或IP.conf
# =============================================

server {
    listen 80;
    # 2026-11-01 新增：happy-mart.pw 未备案，大陆服务器 80/443 被阿里云阻断
    # （返回 403 Non-compliance ICP Filing 页面）。
    # 非标端口不受备案限制，故额外监听 8080，访问 http://happy-mart.pw:8080
    # 备案通过后删掉下面这行即可。
    listen 8080;
    # 已购域名 happy-mart.pw，公网 IP 115.29.29.83
    # 三个都写上：备案通过前用 IP 访问，通过后域名自然生效，不用来回改
    server_name happy-mart.pw www.happy-mart.pw 115.29.29.83;

    charset utf-8;

    # 前端构建产物目录（把 dist 里的文件传到这个目录）
    root /www/wwwroot/happy-mart/dist;
    index index.html;

    # 商品图片上传上限：必须和后端 5MB、前端 5MB 对齐
    # 宝塔默认 1m，不调大会导致 1MB 以上的图上传报 413
    client_max_body_size 5m;

    # 访问日志
    access_log /www/wwwlogs/happy-mart.log;

    # ===== SPA 前端路由 =====
    # 不加 try_files 的话，直接访问 /admin/order 这类前端路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 后端 API 反代 =====
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 购物助手是同步生成，60s 不够用，与后端 RestClient / 前端 axios 的 120s 对齐
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ===== 商品图片反代 =====
    # 必须用 ^~：否则宝塔下面的静态资源正则 location 会先匹配
    # /upload/xxx.jpg，然后去 dist 目录找文件 → 404
    location ^~ /upload/ {
        proxy_pass http://127.0.0.1:8074;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ===== 静态资源缓存 =====
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件（宝塔默认已有类似规则，保留即可）
    location ~ /\. {
        deny all;
    }
}
