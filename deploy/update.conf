# =============================================
# 众乐电子商城 - 自动部署配置（服务器端）
#
# 放到服务器：/www/wwwroot/happy-mart/deploy/update.conf
# 修改后立即生效（update.sh 每次执行都会 source 一遍）。
# =============================================

# 应用根目录（dist / backend / docker-compose.yml 都在这下面）
BASE_DIR=/www/wwwroot/happy-mart

# 产物来源仓库（Gitee，公开仓库拉 Release 资产免鉴权）
REPO_OWNER=liao-zhenhan
REPO_NAME=happy-mart
REPO_BRANCH=master

# 后端健康检查地址（/api/health 由后端 HealthController 提供，探 MySQL + Redis）
HEALTH_URL=http://127.0.0.1:8074/api/health

# 探活降级地址：/api/health 是跟着新 jar 一起上线的，
# 冷启动阶段（服务器还跑旧 jar）打它返回 404，脚本会自动降级用这个业务接口探活。
# 正式上线后 /api/health 可用，这行就只是兜底，不用改。
FALLBACK_HEALTH_URL=http://127.0.0.1:8074/api/product/list

# 健康检查最长等待秒数（后端启动 + Spring 初始化可能要 30~60s）
HEALTH_TIMEOUT=90

# 部署日志
LOG_FILE=/www/wwwlogs/hm-deploy.log

# 宝塔 Nginx 二进制路径（目录整体换 inode 后 reload 用）
NGINX_BIN=/www/server/nginx/sbin/nginx
