server:
  port: 8074

spring:
  application:
    name: happy-mart

  datasource:
    url: jdbc:mysql://localhost:3306/happy_mart?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 200      # 建立连接超时：200ms（快速失败，触发自动重连）
    requested-heartbeat: 60s     # 心跳间隔：60 秒（保活，防止空闲连接被判定为死连接）
    listener:
      simple:
        acknowledge-mode: auto  # 自动确认消息
        prefetch: 1  # 每个消费者一次只处理 1 条消息，避免消息积压
        concurrency: 3  # 最小并发数：3 个消费者处理
        max-concurrency: 10  # 最大并发数：10 个消费者处理
    template:
      retry:
        enabled: true  # 开启重试机制
        initial-interval: 1000ms  # 初始重试间隔：1 秒
        max-attempts: 3  # 最大重试次数：3 次

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml  # 映射文件路径
  type-aliases-package: com.happymart.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 日志实现：标准输出
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: happymart-jwt-secret-key-for-happy-mart-online-shop-2026
  expiration: 86400000

# 支付宝开放平台沙箱环境配置
# 因个人开发者无法申请微信支付企业商户号，改用支付宝沙箱环境验证支付链路
# 沙箱环境和生产环境用同一套 SDK / 签名算法(RSA2) / 接口名，仅网关地址和 APPID 不同
alipay:
  app-id: 9021000166615256
  private-key: |
    
  alipay-public-key: |
    
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do   # 新版沙箱网关（旧版 openapi.alipaydev.com 已废弃）
  notify-url: https://0654527ccb32ad.lhr.life/api/pay/notify   # 本地开发隧道地址（localhost.run，重启后需更新）
  sign-type: RSA2
  charset: UTF-8
  format: json

