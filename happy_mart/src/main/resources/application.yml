server:
  port: 8074

spring:
  application:
    name: happy-mart

  datasource:
    url: jdbc:mysql://localhost:3306/happy_mart?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 1
        concurrency: 3
        max-concurrency: 10
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.happymart.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: happymart-jwt-secret-key-for-happy-mart-online-shop-2026
  expiration: 86400000

# 支付宝开放平台沙箱环境配置
# 因个人开发者无法申请微信支付企业商户号，改用支付宝沙箱环境验证支付链路
# 沙箱环境和生产环境用同一套 SDK / 签名算法(RSA2) / 接口名，仅网关地址和 APPID 不同
alipay:
  app-id: 沙箱APPID（在支付宝开放平台-沙箱环境页面获取）
  private-key: 商户应用私钥（用"RSA签名验签工具2.0"生成密钥对，PKCS8 格式）
  alipay-public-key: 支付宝公钥（生成密钥对后，把商户公钥填入沙箱后台，沙箱会返回这个）
  gateway-url: https://openapi.alipaydev.com/gateway.do   # 沙箱网关，生产环境是 openapi.alipay.com
  notify-url: https://your-ngrok-domain.ngrok.io/api/pay/notify   # 回调地址，本地开发用 ngrok 转发出去
  sign-type: RSA2
  charset: UTF-8
  format: json