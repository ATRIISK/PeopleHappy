server:
  port: 8074

spring:
  application:
    name: happy-mart

  servlet:
    multipart:
      # 文件上传大小限制（管理后台商品图片本地上传，v1.10）
      # 超过 max-file-size 抛 MaxUploadSizeExceededException（GlobalExceptionHandler 已单独接住，提示"图片大小不能超过 5MB"）
      max-file-size: 5MB      # 单文件最大 5MB
      max-request-size: 10MB  # 单次请求体最大 10MB（多文件/表单开销预留）

  datasource:
    url: jdbc:mysql://localhost:3306/happy_mart?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms # 连接超时：3s（快速失败，触发自动重连）
      lettuce:
        pool:
          max-active: 8 # 最大连接数：8
          max-idle: 8 # 最大空闲连接数：8
          min-idle: 0 # 最小空闲连接数：0
          max-wait: 1000 # 获取连接的最大等待时间：1000ms（1s），超时抛异常（缓存自动降级）

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /
    connection-timeout: 200      # 建立连接超时：200ms（快速失败，触发自动重连）
    requested-heartbeat: 60s     # 心跳间隔：60 秒（保活，防止空闲连接被判定为死连接）
    listener:
      simple:
        acknowledge-mode: auto  # 自动确认消息
        prefetch: 1  # 每个消费者一次只处理 1 条消息，避免消息积压
        concurrency: 3  # 最小并发数：3 个消费者处理
        max-concurrency: 10  # 最大并发数：10 个消费者处理
    template:
      retry:
        enabled: true  # 开启重试机制
        initial-interval: 1000ms  # 初始重试间隔：1 秒
        max-attempts: 3  # 最大重试次数：3 次

  # Spring AI（智谱 GLM，OpenAI 兼容协议）—— AI 购物助手（v1.11，阶段四，见开发文档 §14）
  # 2026-11-01 从 DashScope 通义千问切换到智谱开放平台 glm-4-flash-250414。
  # 智谱 v4 接口兼容 OpenAI 协议，故依赖改为 spring-ai-starter-model-openai，只把 base-url 指过去，
  # 业务代码里的 ChatClient / EmbeddingModel / SimpleVectorStore 都是 Spring AI 通用抽象，无需改动。
  # ★ completions-path 必须显式配置：OpenAI starter 默认拼 /v1/chat/completions，
  #   智谱实际路径是 /api/paas/v4/chat/completions，不配会 404。
  # ★ embedding 关闭：该账号调 embedding-2 / embedding-3 均返回「1113 余额不足或无可用资源包」，
  #   向量召回不可用。KnowledgeBaseConfig 已做「没有 EmbeddingModel 就跳过向量路」的降级，
  #   知识库退化为纯关键词召回（extractKeywords + findForKnowledgeBase + 权重排序），
  #   充值后补回 embedding 段即可恢复混合检索。
  # ★ 关闭方式必须是 spring.ai.model.embedding=none（Spring AI 1.x 的全局开关）。
  #   openai 专属的 embedding.enabled 在 1.1.2 里不存在，写了不生效：
  #   实测照样创建 OpenAiEmbeddingModel 并请求默认路径 /v1/embeddings，智谱返回 404。
  # ★ API Key 明文写在项目内（私有仓库 + 打包部署的既定做法，v1.12 起如此）；
  #   生产/多环境建议改 ${GLM_API_KEY} 环境变量注入。
  ai:
    model:
      embedding: none                    # 不装配向量模型，检索走纯关键词
    openai:
      base-url: https://open.bigmodel.cn/api/paas/v4
      api-key: 393801ff0ac2460ab371fd9c2031ec68.sDKgmZDHirPtUUG4
      chat:
        completions-path: /chat/completions
        options:
          model: glm-4-flash-250414      # 对话模型
          temperature: 0.7               # 导购回答略放开随机性，避免过于呆板

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml  # 映射文件路径
  type-aliases-package: com.happymart.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 日志实现：标准输出
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: happymart-jwt-secret-key-for-happy-mart-online-shop-2026
  expiration: 86400000

# 支付宝开放平台沙箱环境配置
# 因个人开发者无法申请微信支付企业商户号，改用支付宝沙箱环境验证支付链路
# 沙箱环境和生产环境用同一套 SDK / 签名算法(RSA2) / 接口名，仅网关地址和 APPID 不同
alipay:
  app-id: 9021000166615256
  private-key: |
    
  alipay-public-key: |
    
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do   # 新版沙箱网关（旧版 openapi.alipaydev.com 已废弃）
  notify-url: https://0654527ccb32ad.lhr.life/api/pay/notify   # 本地开发隧道地址（localhost.run，重启后需更新）
  sign-type: RSA2
  charset: UTF-8
  format: json

# 商品图片本地上传目录（管理后台 v1.10）
# 相对后端工作目录：
#   - 开发（IDEA/mvn）：E:\PeopleHappy\happy_mart\upload
#   - Docker 容器（WORKDIR=/app）：/app/upload（docker-compose 已挂 volume 持久化）
# WebMvcConfig 把 /upload/** 映射到这个目录（静态资源，游客也能看图）
app:
  upload-dir: ./upload

# 商品知识库 RAG 配置（AI 购物助手，v1.11，见开发文档 §14.2）
# index-file-path：商品向量索引文件（SimpleVectorStore 持久化）
#   - 开发（IDEA/mvn）：E:/PeopleHappy/happy_mart/data/product_kb_index.json
#   - Docker 容器（WORKDIR=/app）：/app/data/product_kb_index.json（docker-compose 已挂 volume 持久化）
# 启动时索引文件存在则直接加载，不存在则从商品表全量重建
kb:
  index-file-path: ./data/product_kb_index.json
  keyword-top-k: 5   # 关键词召回条数（SQL LIKE 商品名/描述）
  vector-top-k: 5    # 向量召回条数（embedding 相似度检索）
  context-top-n: 5   # 拼进 prompt 的上下文商品数（[1][2]... 序号）
  doc-max-chars: 500 # 单个商品拼入 prompt 的最大字符数（防 token 溢出）